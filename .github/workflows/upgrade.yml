name: Automatic Dashboard Upgrade

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Medusa Sync Bot"
          git config user.email "bot@noreply.github.com"

      - name: Sync Dashboard from Medusa
        env:
          TARGET_PATH: packages/admin/dashboard
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git remote add upstream-medusa https://github.com/medusajs/medusa.git || true
          git fetch upstream-medusa --tags --force

          CURRENT_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 2 | head -n 1)
          TARGET_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 1)

          echo "Current: $CURRENT_TAG"
          echo "Target : $TARGET_TAG"

          BRANCH="update-$TARGET_TAG"

          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch already exists. Exiting."
            exit 0
          fi

          git checkout -b "$BRANCH"

          # --- Fake ancestor (current version) ---
          BASE_ID=$(git commit-tree "$CURRENT_TAG:$TARGET_PATH" \
            -m "Base History ($CURRENT_TAG)")

          git branch -f base-history "$BASE_ID"
          git merge base-history \
            --allow-unrelated-histories \
            -s ours \
            -m "Chore: Link Medusa history ($CURRENT_TAG)"

          # --- Target update ---
          TARGET_ID=$(git commit-tree "$TARGET_TAG:$TARGET_PATH" \
            -m "Update Target ($TARGET_TAG)")

          git branch -f update-target "$TARGET_ID"
          git merge update-target \
            --allow-unrelated-histories \
            -m "Update: Sync Dashboard to $TARGET_TAG"

          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat: Sync Medusa Dashboard to $TARGET_TAG" \
            --body "**Automated dashboard sync**\n\nFrom: $CURRENT_TAG\nTo: $TARGET_TAG"
