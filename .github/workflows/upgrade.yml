name: Sync Medusa Dashboard

on:
  schedule:
    # Run daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary to calculate history

      - name: Configure Git Bot
        run: |
          git config user.name "Medusa Sync Bot"
          git config user.email "bot@noreply.github.com"

      - name: Check for New Version
        id: check
        run: |
          # 1. Add Upstream Remote
          git remote add upstream https://github.com/medusajs/medusa.git
          
          # 2. Fetch tags FORCEFULLY
          git fetch upstream --tags --force

          # 3. Find the latest stable tag (v2.*)
          LATEST_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 1)
          echo "Latest Medusa Release: $LATEST_TAG"

          # 4. Check if we already have a PR branch for this version
          if git ls-remote --heads origin "update-$LATEST_TAG" | grep -q "update-$LATEST_TAG"; then
            echo "Branch 'update-$LATEST_TAG' already exists. Skipping."
            echo "PROCESS=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 5. Check if the folder exists in this tag (Safety Check)
          if ! git ls-tree -d "upstream/$LATEST_TAG" packages/admin/dashboard; then
             echo "ERROR: 'packages/admin/dashboard' not found in $LATEST_TAG. Skipping."
             echo "PROCESS=skip" >> $GITHUB_OUTPUT
             exit 0
          fi

          echo "PROCESS=run" >> $GITHUB_OUTPUT
          echo "TAG=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Extract and Create PR
        if: steps.check.outputs.PROCESS == 'run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.TAG }}
          TARGET_FOLDER: packages/admin/dashboard
        run: |
          echo "Syncing $TARGET_FOLDER from tag $TAG..."

          # 1. Split the folder history
          # Since you fixed the history locally, subtree should now work smoothly
          git subtree split --prefix=$TARGET_FOLDER -b "update-$TAG" "upstream/$TAG"
          
          # 2. Push to your repo
          git push origin "update-$TAG" --force

          # 3. Create Pull Request
          gh pr create \
            --base main \
            --head "update-$TAG" \
            --title "feat: Update Medusa Dashboard to $TAG" \
            --body "Automated sync from Medusa upstream tag **$TAG**.\n\nSource: \`$TARGET_FOLDER\`\n\n**Instructions:**\n1. Pull this branch locally.\n2. Resolve conflicts (if any).\n3. Merge and push." \
            || echo "PR likely already exists"