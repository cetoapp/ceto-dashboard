name: Automatic Dashboard Upgrade

on:
  workflow_dispatch:
    inputs:
      current_version:
        description: 'The "Vanilla" Medusa version this Repository follows'
        required: true
        default: 'v2.12.4'

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Medusa Sync Bot"
          git config user.email "bot@noreply.github.com"

      - name: Sync Dashboard
        env:
          TARGET_PATH: packages/admin/dashboard
          ANCHOR_TAG: ${{ github.event.inputs.current_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          
          # Fetch Upstream Medusa Tags
          git remote add upstream-medusa https://github.com/medusajs/medusa.git || true
          git fetch upstream-medusa --tags --force

          # Identify the Target (Newest Version)
          TARGET_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 1)

          # Define Branch Names
          BASE_BRANCH="sync/base-$TARGET_TAG"
          HEAD_BRANCH="sync/update-$TARGET_TAG"

          echo "--------------------------------"
          echo "ANCESTOR (Old Vanilla): $ANCHOR_TAG"
          echo "TARGET   (New Vanilla): $TARGET_TAG"
          echo "YOUR CODE: Current content of 'main'"
          echo "--------------------------------"

          # Clean up old runs if they exist
          git push origin --delete "$BASE_BRANCH" 2>/dev/null || true
          git push origin --delete "$HEAD_BRANCH" 2>/dev/null || true

          # ---------------------------------------------------------
          # STEP A: Create the "Base" Branch (Your Code + History Link)
          # ---------------------------------------------------------
          git checkout main
          git checkout -b "$BASE_BRANCH"

          # Generate the "Ancestor Commit" (The Vanilla Old Version)
          # This commit contains the exact code of Medusa at the version you started with.
          ANCHOR_ID=$(git commit-tree "$ANCHOR_TAG:$TARGET_PATH" \
            -m "Anchor: Vanilla Medusa $ANCHOR_TAG")

          # Merge the Ancestor into your Base branch using 'ours' strategy.
          # effectively saying: "Trust me, my current custom code is a child of this Anchor"
          # We do this silently (-q) and allow unrelated histories.
          git branch -f anchor-link "$ANCHOR_ID"
          git merge anchor-link \
            --allow-unrelated-histories \
            -s ours \
            -m "Chore: Link history to Vanilla $ANCHOR_TAG"

          git push origin "$BASE_BRANCH"

          # ---------------------------------------------------------
          # STEP B: Create the "Update" Branch (New Vanilla Version)
          # ---------------------------------------------------------
          # We create a commit for the NEW version, setting the ANCHOR as its parent.
          # This creates the path: Anchor -> Target
          TARGET_ID=$(git commit-tree "$TARGET_TAG:$TARGET_PATH" \
            -p "$ANCHOR_ID" \
            -m "Update: Medusa $TARGET_TAG")

          git checkout -b "$HEAD_BRANCH" "$TARGET_ID"
          git push origin "$HEAD_BRANCH"

          # ---------------------------------------------------------
          # STEP C: Create the Pull Request
          # ---------------------------------------------------------
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "feat: Sync Medusa Dashboard ($ANCHOR_TAG -> $TARGET_TAG)" \
            --body "**Automated Dashboard Sync**
            
            This PR compares:
            1. **Base:** Your code (Custom changes on top of $ANCHOR_TAG)
            2. **Head:** New Medusa (Pure upgrade from $ANCHOR_TAG to $TARGET_TAG)
            
            ### ⚠️ Instructions
            1. Use the **Resolve Conflicts** button in this PR to merge your changes with the new version.
            2. Once resolved and merged, you will have a clean \`$BASE_BRANCH\`.
            3. Create a final PR to merge \`$BASE_BRANCH\` into \`main\`."