name: Automatic Dashboard Upgrade

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Medusa Sync Bot"
          git config user.email "bot@noreply.github.com"

      - name: Sync Dashboard from Medusa
        id: sync
        env:
          TARGET_PATH: packages/admin/dashboard
        run: |
          set -e

          # 1. Fetch Upstream Data
          git remote add upstream-medusa https://github.com/medusajs/medusa.git || true
          git fetch upstream-medusa --tags --force

          CURRENT_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 2 | head -n 1)
          TARGET_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 1)
          
          # Naming the branches clearly
          BASE_BRANCH="sync/base-$TARGET_TAG"
          HEAD_BRANCH="sync/update-$TARGET_TAG"

          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
          echo "HEAD_BRANCH=$HEAD_BRANCH" >> $GITHUB_ENV

          echo "Current: $CURRENT_TAG"
          echo "Target : $TARGET_TAG"

          # If the base branch exists, we assume the sync is already in progress
          if git ls-remote --exit-code --heads origin "$BASE_BRANCH"; then
            echo "Sync branches already exist. Exiting."
            echo "EXISTS=true" >> $GITHUB_ENV
            exit 0
          fi

          # --- PREPARE THE PROXY BASE (The "Current" State) ---
          # 1. Start from MAIN (your current code)
          git checkout main
          git checkout -b "$BASE_BRANCH"

          # 2. Create the Old Medusa Commit (The Anchor)
          ANCHOR_ID=$(git commit-tree "$CURRENT_TAG:$TARGET_PATH" \
            -m "Anchor: Medusa $CURRENT_TAG")

          # 3. Merge Anchor into Proxy Base using 'ours'
          # This tells Git: "Our custom main branch is a descendant of this Anchor"
          # We use --no-commit first to ensure we can force the parentage if needed, 
          # but usually standard merge is fine here.
          git branch -f anchor-point "$ANCHOR_ID"
          git merge anchor-point \
            --allow-unrelated-histories \
            -s ours \
            -m "Chore: Link history to Medusa $CURRENT_TAG"
          
          git push origin "$BASE_BRANCH"

          # --- PREPARE THE HEAD (The "New" State) ---
          # 4. Create the New Medusa Commit
          # IMPORTANT: We set the parent to the SAME Anchor ID created above.
          # This ensures Git sees a direct path from Anchor -> New.
          NEW_ID=$(git commit-tree "$TARGET_TAG:$TARGET_PATH" \
            -p "$ANCHOR_ID" \
            -m "Update: Medusa $TARGET_TAG")

          git checkout -b "$HEAD_BRANCH" "$NEW_ID"
          git push origin "$HEAD_BRANCH"

          echo "EXISTS=false" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ env.BASE_BRANCH }}" \
            --head "${{ env.HEAD_BRANCH }}" \
            --title "feat: Sync Medusa Dashboard to ${{ env.TARGET_TAG }}" \
            --body "**Automated dashboard sync**
            
            From: ${{ env.CURRENT_TAG }}
            To: ${{ env.TARGET_TAG }}
            
            ### ⚠️ Instructions
            1. This PR shows the **true conflicts** between your code and the new Medusa version.
            2. Resolve the conflicts using the GitHub UI or locally.
            3. Merge this PR into the temporary base branch (\`${{ env.BASE_BRANCH }}\`).
            4. **Final Step:** Merge \`${{ env.BASE_BRANCH }}\` into \`main\` (this will be a clean merge)."