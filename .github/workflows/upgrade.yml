name: Automatic Dashboard Upgrade

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Medusa Sync Bot"
          git config user.email "bot@noreply.github.com"

      - name: Sync Dashboard from Medusa
        id: sync
        env:
          TARGET_PATH: packages/admin/dashboard
        run: |
          set -e

          git remote add upstream-medusa https://github.com/medusajs/medusa.git || true
          git fetch upstream-medusa --tags --force

          CURRENT_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 2 | head -n 1)
          TARGET_TAG=$(git tag -l "v2*" --sort=version:refname | tail -n 1)

          BRANCH="update-$TARGET_TAG"

          # Persist variables for next step
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          echo "Current: $CURRENT_TAG"
          echo "Target : $TARGET_TAG"
          echo "Branch : $BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch already exists. Exiting."
            exit 0
          fi

          git checkout -b "$BRANCH"

          # --- Fake ancestor commit ---
          BASE_ID=$(git commit-tree "$CURRENT_TAG:$TARGET_PATH" \
            -m "Base History ($CURRENT_TAG)")

          git branch -f base-history "$BASE_ID"
          git merge base-history \
            --allow-unrelated-histories \
            -s ours \
            -m "Chore: Link Medusa history ($CURRENT_TAG)"

          # --- Target update commit ---
          TARGET_ID=$(git commit-tree "$TARGET_TAG:$TARGET_PATH" \
            -m "Update Target ($TARGET_TAG)")

          git branch -f update-target "$TARGET_ID"

          # Allow conflicts
          set +e
          git merge update-target \
            --allow-unrelated-histories \
            -m "Update: Sync Dashboard to $TARGET_TAG"
          set -e

          # Commit conflicted state so PR can show conflicts
          git add -A
          git commit -m "WIP: Resolve conflicts for Medusa $TARGET_TAG" || true

          git push origin "$BRANCH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}       
          base: main                       
          commit-message: "Sync Medusa Dashboard (${{ env.BRANCH }})"
          title: "feat: Sync Medusa Dashboard to ${{ env.BRANCH }}"
          body: |
            **Automated dashboard sync**
            From: ${{ env.CURRENT_TAG }}
            To: ${{ env.TARGET_TAG }}
            ⚠️ This PR contains merge conflicts that require manual resolution.

